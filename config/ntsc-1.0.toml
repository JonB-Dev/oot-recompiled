# Config for the Ocarina of Time NTSC-U 1.0 recompilation.
#
# Modeled on upstream/Zelda64Recomp/us.rev1.toml for STRUCTURE AND TECHNIQUE ONLY. Every address,
# every encoded instruction word and every function name below is computed from OUR elf and OUR rom.
# The reference project's values belong to a different game and would be plausible and wrong.
#
# Paths are relative to this file.

[input]
# The ROM header's entrypoint, confirmed against the elf, which exports a function there. The
# context dump renames it recomp_entrypoint, so that is the name the symbol table carries.
entrypoint = 0x80000400

# Symbols plus the raw rom, not the elf. The elf was read once at phase 6 to produce these tables;
# from here on the build needs no Linux toolchain, which is the point of committing them.
symbols_file_path = "../OoTRecompSyms/oot.ntsc-1.0.syms.toml"
rom_file_path = "../build/oot.ntsc-1.0.rom_uncompressed.z64"

# The 469 overlay sections, generated from the elf by tools/gen_overlay_list.py and cross-checked
# against the decomp's spec in both directions.
relocatable_sections_path = "overlays.ntsc-1.0.txt"

output_func_path = "../RecompiledFuncs"

bss_section_suffix = ".bss"

# What every generated file includes at the top. The default is `#include "recomp.h"`; this adds
# declarations for four libultra functions the recompiler calls but does not translate, because its
# own symbol_lists.cpp expects librecomp to provide them. Two of the four librecomp does provide;
# two it does not, and we implement those in src/game/libultra_shims.cpp. Without this the
# generated code fails to compile with "call to undeclared function".
recomp_include = "#include \"game/recomp_extra_decls.h\""

[patches]
# Each entry below was found by disassembling THIS game, not by copying the reference project's
# list. Two of the reference's three stubs have analogues here; its third does not exist in this
# game at all; and its one instruction patch has no analog, for a reason worth reading.

stubs = [
    # Writes RCP status registers directly, via osDpSetStatus(0x28) and __osSpSetStatus(0x4082),
    # which is a real RCP that does not exist under the runtime.
    #
    # THIS IS ON THE BOOT PATH IN THIS GAME. The reference project describes its equivalent as an
    # unused function; here `Main` at 0x800A1FD8 calls it, so it runs every launch. Disassembled at
    # 0x800CC8B8 to confirm what it does before stubbing it.
    "RcpUtils_Reset",

    # Called only from RcpUtils_Reset, twice, at 0x800CC8C0 and 0x800CC8D8, and nowhere else in the
    # whole elf. It reads and prints RCP register state, so it is meaningless without an RCP.
    # Stubbed with its only caller rather than left as the one thing that still touches those
    # registers.
    "RcpUtils_PrintRegisterStatus",

    # Stubbed to work around a RECOMPILER bug, not because of anything this function does.
    #
    # At 0x801C7360 it executes `lw $zero, 0x0($t9)`: a load into the hardwired zero register, which
    # on MIPS is a deliberate discarded read, the usual way to force a memory access for its side
    # effect. The recompiler translates the destination register literally and emits
    #
    #     0 = MEM_W(ctx->r25, 0X0);
    #
    # which is not valid C, and the compiler says only "expression is not assignable".
    #
    # This is the ONLY occurrence in all 13343 translated functions, checked rather than assumed.
    # The function is at 0x801C7268, inside the `..n64dd` section (0x801C6E80, 0x12D10 bytes, 209
    # functions): the 64DD disk drive library, which ships in the retail ROM as dead code and never
    # runs, since the 64DD was Japan only and this game does not drive it.
    #
    # If the 64DD ever mattered here, the fix would be in the recompiler rather than this list.
    "func_801C7268",

    # Reads the CIC copy protection chip's boot magic values:
    #
    #     gCICBootMagic0 = IO_READ(0x002FB1F4);
    #     gCICBootMagic1 = IO_READ(0x002FE1C0);
    #
    # IPL3 writes those into RDRAM during a real console's boot. There is no IPL3 here, so the read
    # is of a hardware address that does not exist and it faults immediately. Found by BOOTING:
    # bootproc called it and the crash handler named it, on the first run that got this far.
    #
    # Worth recording how this was missed at Phase 9. The reference project stubs `CIC6105_Init`
    # for the same reason, and searching for that exact name here found nothing, correctly, because
    # this game has no function by that name. It has eight CIC6105 functions under different names.
    # Searching for the reference's SYMBOL rather than for the reference's PROBLEM is the mistake.
    "CIC6105_SaveBootMagicValues",

    # Probes the 64DD drive's hardware registers. `bootproc` calls it unconditionally, right after
    # osCartRomInit, so it runs on every boot even though the 64DD never existed outside Japan and
    # this game never uses the handle it returns.
    #
    # Stubbed rather than patched: it returns a drive handle that only 64DD code reads, and all of
    # that code is dead here. Found the same way as the CIC one, by booting and reading the stack.
    "osDriveRomInit",

    # The anti-piracy check. `Main` calls it, and it does two things that cannot work here: it
    # submits the CIC6105 RSP task, whose microcode is rspboot and which this project does not
    # recompile, and then reads the result straight out of RSP DMEM:
    #
    #     sCICTaskResult0 = IO_READ(SP_DMEM_START + 0xFF4);
    #     sCICTaskResult1 = IO_READ(SP_DMEM_START + 0xFFC);
    #
    # There is no DMEM to read, and the crash address ended in FF4, which is how it was identified.
    #
    # The results feed only `CIC6105_FaultClient`, a debug screen that prints whether the check
    # passed. Nothing about gameplay depends on them.
    #
    # STUBBING THIS ALSO REMOVES A TASK THAT WAS BEING MIS-DISPATCHED. sCIC6105Task declares type 4,
    # which is the same number as M_NJPEGTASK, so the RSP dispatcher matched it to the JPEG
    # microcode and ran that over unrelated data. See src/main/boot.cpp, which now matches on the
    # microcode ADDRESS rather than the type for exactly this reason.
    "CIC6105_RunBootTask",
]

# Nothing yet. The reference project ignores one symbol that is not really a function; this game's
# equivalent cases were all size-recorded wrongly instead, and are corrected at the source in
# dump-context.ntsc-1.0.toml rather than ignored here.
ignored = []

# NO INSTRUCTION PATCHES, and this is a finding rather than an omission.
#
# The reference project patches one instruction in its AudioHeap_WritebackDCache, rewriting
# `lui $at, 0x2000` to `lui $at, 0x0000` so audio display lists are written to kseg0 rather than
# kseg1, which saves the recompiler from checking for uncached addresses on every memory operation.
#
# This game has a function of that name, at 0x800B37F8, and it does not do that. It is an eight
# instruction wrapper whose only real content is `jal Audio_WritebackDCache`. Following it to
# 0x800BBE40 finds osSetIntMask, osWritebackDCache, osSetIntMask: all libultra calls the runtime
# implements, with no address arithmetic to patch and no `lui` of 0x2000 anywhere in either
# function.
#
# So the reference's patch has no analog here. Writing one anyway, at the address its config
# names, would have patched an unrelated instruction in a different game's memory map.
